name: ci

# Verificación: ¿está sano el código? No publica nada.
#
# Ojo con el branches-ignore: filtra sólo el evento `push`, y ahí la rama es la
# que recibe el commit, no la que apunta un PR. El trigger `pull_request` no
# tiene filtro, así que un PR hacia develop entra igual. En orden:
#
#   push a feature/x          -> corre acá
#   PR feature/x -> develop   -> corre acá (por el pull_request)
#   el merge cae en develop   -> corre release.yml, que llama a la misma suite
#
# Nada entra a develop sin pasar los tests. Lo único que evita el ignore es
# correrlos dos veces sobre el mismo commit de merge.
on:
  pull_request:
  push:
    branches-ignore: [main, develop]
  workflow_dispatch:

# Una corrida por rama: si pusheás dos veces seguidas, la primera se cancela en
# vez de construir cuatro binarios que ya no le importan a nadie.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PyInstaller importa PySide6 para analizarlo; sin display eso puede intentar
  # abrir una conexión que en el runner no existe.
  QT_QPA_PLATFORM: offscreen

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: build ${{ matrix.nombre }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nombre: linux
            artefacto: kobun
          - os: windows-latest
            nombre: windows
            artefacto: kobun.exe

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python-env
        with:
          extras: build

      - uses: ./.github/actions/build-app
        with:
          artefacto: ${{ matrix.artefacto }}

      # Sirve para probar el binario de una rama sin esperar una release.
      - uses: actions/upload-artifact@v4
        with:
          name: kobun-${{ matrix.nombre }}
          path: dist/${{ matrix.artefacto }}
          retention-days: 30
          if-no-files-found: error
