name: release

# Publicación. La versión no se decide acá: la deciden los commits. Un push a
# develop publica una prerelease (0.2.0-alpha.N) y un push a main la versión
# definitiva, según lo que digan los prefijos conventional (`feat:`, `fix:`, …).
# La configuración vive en pyproject.toml, en [tool.semantic_release].
on:
  push:
    branches: [main, develop]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  # Lo mismo que corre en un PR: publicar sin haber corrido los tests sería
  # publicar a ciegas.
  tests:
    uses: ./.github/workflows/tests.yml

  version:
    name: versionar
    needs: tests
    # Corta el bucle: a diferencia de GITHUB_TOKEN, un push hecho con el token
    # de una GitHub App **sí** dispara workflows, así que el commit de versión
    # volvería a entrar acá. El `[skip ci]` del mensaje ya debería evitar la
    # corrida; esto es el respaldo si alguien lo saca.
    if: github.actor != 'kobun-release-bot[bot]'
    runs-on: ubuntu-latest
    # No es decorativo: APP_ID y APP_PRIVATE_KEY viven en este environment, y un
    # job que no lo declara los ve vacíos. Sin esta línea el paso del token
    # falla con "appId option is required".
    environment: KOBUN_RELEASE
    # Una release por vez: dos pushes seguidos correrían dos versionados en
    # paralelo y el segundo intentaría empujar sobre una rama que ya se movió.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      # Sólo lectura: lo que empuja a main y crea la release es el token de la
      # GitHub App, no GITHUB_TOKEN. Declararlo con escritura acá sería pedir un
      # permiso que nada usa.
      contents: read
    outputs:
      publicada: ${{ steps.psr.outputs.released }}
      version: ${{ steps.psr.outputs.version }}
      tag: ${{ steps.psr.outputs.tag }}
    steps:
      # GITHUB_TOKEN no puede empujar a una rama protegida: el ruleset de main
      # sólo exceptúa a la GitHub App kobun-release-bot. Este paso cambia la
      # clave privada de la app por un token de instalación que dura una hora.
      - name: Token de la GitHub App
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # La historia completa, con tags: sin ella no se puede saber qué cambió
      # desde la última versión ni cuál era. El token va acá para que quede
      # guardado en el remoto local y el push del versionado salga con él.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: ./.github/actions/python-env
        with:
          extras: release

      - name: Versionar, escribir el changelog y taguear
        # Decide la versión a partir de los commits: `feat:` sube el minor,
        # `fix:`/`perf:` el patch, el resto no publica nada. Si no hay nada que
        # ameritar, no hace nada y deja released=false.
        #
        # Cuando sí publica: sube __version__ en kobun/__init__.py y la versión
        # del instalador, actualiza docs/changelog.md, commitea, taguea, empuja
        # y crea la release. La marca de prerelease la pone solo, según si la
        # versión tiene sufijo.
        id: psr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: semantic-release -v version

      - name: Escribir las notas de la release
        # semantic-release ya dejó unas notas, pero se reemplazan: éstas llevan
        # las instrucciones de instalación y, en una versión definitiva, todos
        # los cambios desde la última definitiva —no sólo los del último alpha,
        # que es lo único que quedaría si se contara tag a tag.
        if: steps.psr.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python3 scripts/release_notes.py "${{ steps.psr.outputs.tag }}" --salida notas.md
          gh release edit "${{ steps.psr.outputs.tag }}" --notes-file notas.md

      - name: Resumen
        # Sin `always()`: si el versionado falló, "nada que publicar" sería una
        # explicación falsa de lo que pasó.
        run: |
          if [ "${{ steps.psr.outputs.released }}" = "true" ]; then
            {
              echo "### ${{ steps.psr.outputs.tag }}"
              echo "Anterior: ${{ steps.psr.outputs.previous_version }}"
              echo ""
              cat notas.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nada que publicar: ningún commit de este push amerita una versión nueva." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  binarios:
    name: binarios ${{ matrix.nombre }}
    needs: version
    if: needs.version.outputs.publicada == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nombre: linux
            artefacto: kobun
            # Nombres limpios: la extensión ya distingue el sistema y la versión
            # se ve dentro de la app. El .deb es la excepción, porque las
            # herramientas de Debian esperan su convención.
            adjuntos: dist/kobun dist/*.deb
          - os: windows-latest
            nombre: windows
            artefacto: kobun.exe
            adjuntos: dist/kobun.exe

    steps:
      # El tag, no la rama: la rama ya tiene el commit de versión, pero apuntar
      # al tag deja explícito que lo que se publica es exactamente eso.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: ./.github/actions/python-env
        with:
          extras: build

      - uses: ./.github/actions/build-app
        with:
          artefacto: ${{ matrix.artefacto }}

      - name: Adjuntar a la release
        # Con GITHUB_TOKEN alcanza: subir un archivo a una release no toca
        # ninguna rama, así que el ruleset no interviene y no hace falta el
        # token de la app.
        #
        # --clobber para que reintentar el job reemplace el archivo en vez de
        # fallar porque ya existe.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" ${{ matrix.adjuntos }} --clobber
