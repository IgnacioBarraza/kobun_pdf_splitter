name: build

# Los binarios se generan en el sistema al que apuntan: PyInstaller no compila
# cruzado, así que el .exe de Windows sale del runner de Windows y no hay forma
# de producirlo desde Linux.
#
# La versión no se decide acá: la deciden los commits. Un push a develop publica
# una prerelease (0.2.0-alpha.N) y un push a main la versión definitiva, según
# lo que digan los prefijos conventional (`feat:`, `fix:`, …). La configuración
# vive en pyproject.toml, en [tool.semantic_release].
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # Qt necesita una plataforma sin pantalla en CI; sin esto los tests de
  # interfaz fallan al no encontrar display.
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # PySide6 trae sus propias librerías de Qt pero enlaza contra estas, que
      # no vienen en el runner. Sin ellas ni siquiera se puede importar.
      - name: Dependencias de sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Instalar el proyecto
        run: pip install -e .[dev]

      - name: Suite completa
        run: pytest -q

      - name: Suite de dominio sin dependencias
        # Verifica el invariante del proyecto: unit/ tiene que correr sin
        # PyMuPDF ni PySide6 instalados.
        run: |
          python -m venv /tmp/pelado
          /tmp/pelado/bin/pip install -q pytest
          /tmp/pelado/bin/python -m pytest kobun/tests/unit -q

  # Construcción de verificación. Sólo corre donde no hay release: en un push a
  # main o develop los binarios los construye "publicar", después de que la
  # versión ya está subida, para no construirlos dos veces.
  build:
    name: build ${{ matrix.nombre }}
    if: github.event_name != 'push'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nombre: linux
            artefacto: kobun
          - os: windows-latest
            nombre: windows
            artefacto: kobun.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Dependencias de sistema para Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Instalar el proyecto
        # En modo editable, igual que la configuración verificada en local: la
        # receta compensa con `pathex` el hecho de que PyInstaller no puede
        # seguir el hook de setuptools.
        run: pip install -e .[build]

      - name: Construir
        run: python scripts/build_app.py

      - name: Empaquetar .deb
        if: runner.os == 'Linux'
        run: python scripts/build_deb.py

      - name: Comprobar que la salida existe y tiene tamaño razonable
        shell: python
        run: |
          import sys
          from pathlib import Path

          binario = Path("dist") / "${{ matrix.artefacto }}"
          if not binario.is_file():
              sys.exit(f"No se generó {binario}")

          mb = binario.stat().st_size / 1024 / 1024
          print(f"{binario}: {mb:.0f} MB")

          # Un binario mucho más chico significa que algo no se empaquetó.
          if mb < 40:
              sys.exit(f"Sospechosamente chico ({mb:.0f} MB): faltan dependencias")

      - uses: actions/upload-artifact@v4
        with:
          name: kobun-${{ matrix.nombre }}
          path: dist/${{ matrix.artefacto }}
          retention-days: 30
          if-no-files-found: error

  # =========================
  # Versionado
  # =========================

  version:
    name: versionar
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    # Una release por vez, y sólo acá: dos pushes seguidos correrían dos
    # versionados en paralelo y el segundo intentaría empujar sobre una rama que
    # ya se movió. A nivel de workflow esto además serializaría los PRs, que no
    # tienen por qué esperarse entre ellos.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      # Empuja el commit de versión, el tag, y crea la release.
      contents: write
    outputs:
      publicada: ${{ steps.psr.outputs.released }}
      version: ${{ steps.psr.outputs.version }}
      tag: ${{ steps.psr.outputs.tag }}
    steps:
      # La historia completa, con tags: sin ella no se puede saber qué cambió
      # desde la última versión ni cuál era.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar semantic-release
        run: pip install -e .[release]

      - name: Versionar, escribir el changelog y taguear
        # Decide la versión a partir de los commits: `feat:` sube el minor,
        # `fix:`/`perf:` el patch, el resto no publica nada. Si no hay nada que
        # ameritar, no hace nada y deja released=false.
        #
        # Cuando sí publica: sube __version__ en kobun/__init__.py, actualiza
        # docs/changelog.md, commitea, taguea, empuja y crea la release. La
        # marca de prerelease la pone solo, según si la versión tiene sufijo.
        id: psr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release -v version

      - name: Escribir las notas de la release
        # semantic-release ya dejó unas notas, pero se reemplazan: éstas llevan
        # las instrucciones de instalación y, en una versión definitiva, todos
        # los cambios desde la última definitiva —no sólo los del último alpha,
        # que es lo único que quedaría si se contara tag a tag.
        if: steps.psr.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release_notes.py "${{ steps.psr.outputs.tag }}" --salida notas.md
          gh release edit "${{ steps.psr.outputs.tag }}" --notes-file notas.md

      - name: Resumen
        # Sin `always()`: si el versionado falló, "nada que publicar" sería una
        # explicación falsa de lo que pasó.
        run: |
          if [ "${{ steps.psr.outputs.released }}" = "true" ]; then
            {
              echo "### ${{ steps.psr.outputs.tag }}"
              echo "Anterior: ${{ steps.psr.outputs.previous_version }}"
              echo ""
              cat notas.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nada que publicar: ningún commit de este push amerita una versión nueva." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # =========================
  # Binarios de la release
  # =========================

  publicar:
    name: publicar ${{ matrix.nombre }}
    needs: version
    if: needs.version.outputs.publicada == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nombre: linux
            artefacto: kobun
            # Nombres limpios: la extensión ya distingue el sistema y la versión
            # se ve dentro de la app. El .deb es la excepción, porque las
            # herramientas de Debian esperan su convención.
            adjuntos: dist/kobun dist/*.deb
          - os: windows-latest
            nombre: windows
            artefacto: kobun.exe
            adjuntos: dist/kobun.exe

    steps:
      # El tag, no la rama: la rama ya tiene el commit de versión, pero apuntar
      # al tag deja explícito que lo que se publica es exactamente eso.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Dependencias de sistema para Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Instalar el proyecto
        run: pip install -e .[build]

      - name: Construir
        run: python scripts/build_app.py

      - name: Empaquetar .deb
        # Un binario suelto no alcanza en Linux: los exploradores ya no lanzan
        # ejecutables con doble clic, así que hace falta instalarlo con su
        # entrada .desktop para que aparezca en el menú de aplicaciones.
        if: runner.os == 'Linux'
        run: python scripts/build_deb.py

      - name: Comprobar que la salida existe y tiene tamaño razonable
        shell: python
        run: |
          import sys
          from pathlib import Path

          binario = Path("dist") / "${{ matrix.artefacto }}"
          if not binario.is_file():
              sys.exit(f"No se generó {binario}")

          mb = binario.stat().st_size / 1024 / 1024
          print(f"{binario}: {mb:.0f} MB")

          if mb < 40:
              sys.exit(f"Sospechosamente chico ({mb:.0f} MB): faltan dependencias")

      - name: Adjuntar a la release
        # --clobber para que reintentar el job reemplace el archivo en vez de
        # fallar porque ya existe.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.version.outputs.tag }}" ${{ matrix.adjuntos }} --clobber
