name: build

# Los binarios se generan en el sistema al que apuntan: PyInstaller no compila
# cruzado, así que el .exe de Windows sale del runner de Windows y no hay forma
# de producirlo desde Linux.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # Qt necesita una plataforma sin pantalla en CI; sin esto los tests de
  # interfaz fallan al no encontrar display.
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # PySide6 trae sus propias librerías de Qt pero enlaza contra estas, que
      # no vienen en el runner. Sin ellas ni siquiera se puede importar.
      - name: Dependencias de sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Instalar el proyecto
        run: pip install -e .[dev]

      - name: Suite completa
        run: pytest -q

      - name: Suite de dominio sin dependencias
        # Verifica el invariante del proyecto: unit/ tiene que correr sin
        # PyMuPDF ni PySide6 instalados.
        run: |
          python -m venv /tmp/pelado
          /tmp/pelado/bin/pip install -q pytest
          /tmp/pelado/bin/python -m pytest kobun/tests/unit -q

  build:
    name: ${{ matrix.nombre }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nombre: linux
            artefacto: kobun
          - os: windows-latest
            nombre: windows
            artefacto: kobun.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Dependencias de sistema para Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Instalar el proyecto
        # En modo editable, igual que la configuración verificada en local: la
        # receta compensa con `pathex` el hecho de que PyInstaller no puede
        # seguir el hook de setuptools.
        run: pip install -e .[build]

      - name: Construir
        run: python scripts/build_app.py

      - name: Empaquetar .deb
        # Un binario suelto no alcanza en Linux: los exploradores ya no lanzan
        # ejecutables con doble clic, así que hace falta instalarlo con su
        # entrada .desktop para que aparezca en el menú de aplicaciones.
        if: runner.os == 'Linux'
        run: python scripts/build_deb.py

      - name: Comprobar que la salida existe y tiene tamaño razonable
        shell: python
        run: |
          import sys
          from pathlib import Path

          binario = Path("dist") / "${{ matrix.artefacto }}"
          if not binario.is_file():
              sys.exit(f"No se generó {binario}")

          mb = binario.stat().st_size / 1024 / 1024
          print(f"{binario}: {mb:.0f} MB")

          # Un binario mucho más chico significa que algo no se empaquetó.
          if mb < 40:
              sys.exit(f"Sospechosamente chico ({mb:.0f} MB): faltan dependencias")

      # El nombre lleva la plataforma porque los artifacts de una misma corrida
      # deben ser únicos; los archivos que se publican en la release sí van con
      # nombre limpio.
      - uses: actions/upload-artifact@v4
        with:
          name: kobun-${{ matrix.nombre }}
          path: dist/${{ matrix.artefacto }}
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: kobun-deb
          path: dist/*.deb
          retention-days: 30
          if-no-files-found: error

  release:
    name: publicar
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Reunir los archivos a publicar
        # Nombres limpios: la extensión ya distingue el sistema y la versión se
        # ve dentro de la app, así que no hace falta repetirla en el archivo.
        # El .deb es la excepción: conserva la convención de Debian porque las
        # herramientas del ecosistema la esperan.
        run: |
          mkdir -p publicar
          cp artefactos/kobun-linux/kobun       publicar/kobun
          cp artefactos/kobun-windows/kobun.exe publicar/kobun.exe
          cp artefactos/kobun-deb/*.deb         publicar/
          ls -la publicar/

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" publicar/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Kobun ${GITHUB_REF_NAME}" \
            --notes-file - <<'NOTAS'
          ### Windows

          `kobun.exe` es portable: se descarga y se abre, no se instala.

          ### Linux

          **Recomendado**: el `.deb`, que instala la app en el menú de
          aplicaciones con su icono.

          ```
          sudo apt install ./kobun_*_amd64.deb
          ```

          El binario suelto `kobun` sirve para otras distribuciones, pero tené
          en cuenta dos cosas: hay que darle permiso con `chmod +x` (el ZIP de
          descarga no lo preserva) y **los exploradores de archivos modernos no
          lanzan binarios con doble clic**, así que hay que ejecutarlo desde una
          terminal.
          NOTAS
