name: tests

# Called by ci.yml and release.yml, so the suite has a single definition.
on:
  workflow_call:

jobs:
  suite:
    name: suite
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/python-env
        with:
          extras: dev
          qt-runtime: "true"

      - name: Full suite
        run: pytest -q

      - name: Domain suite without dependencies
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install -q pytest
          /tmp/bare/bin/python -m pytest kobun/tests/unit -q
